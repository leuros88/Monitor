<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status - Global Monitor</title>
    <!-- Fonts and Modern Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --border-color: #334155;
            --comment-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            height: 40px;
            max-width: 180px;
            object-fit: contain;
            border-radius: 4px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* General Status Banner */
        .status-banner {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 1.1rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .status-indicator {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }

        .operational { background-color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .disrupted { background-color: var(--accent-red); box-shadow: 0 0 10px var(--accent-red); }

        /* Sections */
        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .incident-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }

        .incident-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s ease;
        }

        .incident-card:hover {
            border-color: var(--text-secondary);
        }

        .incident-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .incident-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
        }

        .incident-title:hover {
            text-decoration: underline;
        }

        .badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-open { background-color: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .badge-closed { background-color: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }

        .incident-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .incident-body {
            font-size: 0.95rem;
            color: var(--text-secondary);
            white-space: pre-line;
            margin-bottom: 15px;
        }

        /* Estilos para los comentarios / respuestas del issue */
        .comments-section {
            margin-top: 15px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .comment-item {
            background-color: var(--comment-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.9rem;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .comment-body {
            color: var(--text-primary);
            white-space: pre-line;
        }

        .loading, .no-incidents {
            text-align: center;
            color: var(--text-secondary);
            padding: 30px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header with Logo -->
        <header>
            <div class="logo-area">
                <img src="https://aerofinancialfse.com/wp-content/uploads/2025/10/logo.png" alt="AeroFinancialFSE Logo" class="logo" onerror="this.style.display='none'">
                <h1>Service Status</h1>
            </div>
            <div id="last-updated" style="font-size: 0.85rem; color: var(--text-secondary);">Updating...</div>
        </header>

        <!-- Global Status Banner -->
        <div id="global-status-banner" class="status-banner">
            <span id="status-dot" class="status-indicator operational"></span>
            <span id="status-text">Checking system status...</span>
        </div>

        <!-- Active Incidents -->
        <section>
            <h2>Active Incidents</h2>
            <div id="active-incidents" class="incident-list">
                <div class="loading">Loading active incidents...</div>
            </div>
        </section>

        <!-- Incident History -->
        <section>
            <h2>Incident History</h2>
            <div id="historical-incidents" class="incident-list">
                <div class="loading">Loading history...</div>
            </div>
        </section>
    </div>

    <script>
        // CONFIGURATION
        const REPO_OWNER = 'Leuros88';
        const REPO_NAME = 'Monitor';
        const LABEL = 'global-alert';
        const GITHUB_TOKEN = ''; // Optional: Add a Personal Access Token if the repo is private

        // Usuarios autorizados cuyas respuestas/comentarios SÍ se mostrarán en la web
        const ALLOWED_USERS = ['Leuros88']; 

        async function fetchIssues() {
            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues?labels=${LABEL}&state=all&sort=created&direction=desc`;
            
            const headers = {
                'Accept': 'application/vnd.github.v3+json'
            };
            if (GITHUB_TOKEN) {
                headers['Authorization'] = `token ${GITHUB_TOKEN}`;
            }

            try {
                const response = await fetch(url, { headers });
                if (!response.ok) throw new Error('Failed to connect to GitHub API');
                const issues = await response.json();
                
                const issuesWithComments = await Promise.all(issues.map(async (issue) => {
                    const commentsUrl = issue.comments_url;
                    try {
                        const commResponse = await fetch(commentsUrl, { headers });
                        const comments = commResponse.ok ? await commResponse.json() : [];
                        return { ...issue, resolvedComments: comments };
                    } catch (e) {
                        return { ...issue, resolvedComments: [] };
                    }
                }));

                processIssues(issuesWithComments);
            } catch (error) {
                console.error(error);
                document.getElementById('active-incidents').innerHTML = `<div class="no-incidents">Failed to load monitor data.</div>`;
                document.getElementById('historical-incidents').innerHTML = `<div class="no-incidents">Failed to load monitor data.</div>`;
            }
        }

        function processIssues(issues) {
            const realIssues = issues.filter(issue => !issue.pull_request);

            const activeContainer = document.getElementById('active-incidents');
            const historyContainer = document.getElementById('historical-incidents');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');

            const active = realIssues.filter(i => i.state === 'open');
            const closed = realIssues.filter(i => i.state === 'closed');

            if (active.length > 0) {
                statusDot.className = 'status-indicator disrupted';
                statusText.textContent = `Attention: There are ${active.length} active global alert(s) reported.`;
            } else {
                statusDot.className = 'status-indicator operational';
                statusText.textContent = 'All Systems Operational';
            }

            activeContainer.innerHTML = active.length === 0 
                ? `<div class="no-incidents">No active incidents at this time. All systems normal!</div>` 
                : active.map(i => createCardHTML(i)).join('');

            historyContainer.innerHTML = closed.length === 0 
                ? `<div class="no-incidents">No past incidents recorded in history.</div>` 
                : closed.map(i => createCardHTML(i)).join('');

            document.getElementById('last-updated').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
        }

        function createCardHTML(issue) {
            const date = new Date(issue.created_at).toLocaleString('en-US', {
                dateStyle: 'medium',
                timeStyle: 'short'
            });
            
            const stateBadge = issue.state === 'open' 
                ? '<span class="badge badge-open">Active</span>' 
                : '<span class="badge badge-closed">Resolved</span>';

            const bodyText = issue.body ? escapeHTML(issue.body) : 'No detailed description provided.';

            // Filtrar comentarios para mostrar SOLO los de los usuarios permitidos (ej. Leuros88)
            let commentsHTML = '';
            if (issue.resolvedComments && issue.resolvedComments.length > 0) {
                const filteredComments = issue.resolvedComments.filter(comment => 
                    comment.user && ALLOWED_USERS.includes(comment.user.login)
                );

                if (filteredComments.length > 0) {
                    const commentCards = filteredComments.map(comment => {
                        const commentDate = new Date(comment.created_at).toLocaleString('en-US', {
                            dateStyle: 'medium',
                            timeStyle: 'short'
                        });
                        return `
                            <div class="comment-item">
                                <div class="comment-header">
                                    <span><strong>${escapeHTML(comment.user.login)}</strong></span>
                                    <span>${commentDate}</span>
                                </div>
                                <div class="comment-body">${escapeHTML(comment.body)}</div>
                            </div>
                        `;
                    }).join('');

                    commentsHTML = `
                        <div class="comments-section">
                            <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);">Updates / Responses:</div>
                            ${commentCards}
                        </div>
                    `;
                }
            }

            return `
                <div class="incident-card">
                    <div class="incident-header">
                        <a href="${issue.html_url}" target="_blank" class="incident-title">${escapeHTML(issue.title)}</a>
                        ${stateBadge}
                    </div>
                    <div class="incident-date">Created on: ${date}</div>
                    <div class="incident-body">${bodyText}</div>
                    ${commentsHTML}
                </div>
            `;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        fetchIssues();
        setInterval(fetchIssues, 300000);
    </script>
</body>
</html>
