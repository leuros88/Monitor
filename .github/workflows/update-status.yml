name: Update Status Monitor

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

jobs:
  build-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Issues and Generate JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          REPO_OWNER: "Leuros88"
          REPO_NAME: "Monitor"
          GLOBAL_LABEL: "global-alert"
          INFO_LABEL: "info"
          ALLOWED_USER: "Leuros88"
        run: |
          GLOBAL_URL="https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/issues?labels=$GLOBAL_LABEL&state=all&sort=created&direction=desc"
          INFO_URL="https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/issues?labels=$INFO_LABEL&state=all&sort=created&direction=desc"

          RAW_GLOBAL=$(curl -s -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" "$GLOBAL_URL")
          RAW_INFO=$(curl -s -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" "$INFO_URL")
          export RAW_GLOBAL RAW_INFO

          node -e '
            const fs = require("fs");
            const rawGlobal = JSON.parse(process.env.RAW_GLOBAL || "[]");
            const rawInfo = JSON.parse(process.env.RAW_INFO || "[]");
            const allowedUser = process.env.ALLOWED_USER;
            const token = process.env.GITHUB_TOKEN;

            async function buildIssueObj(issue) {
              let commentsJson = [];
              try {
                const commRes = await fetch(issue.comments_url, {
                  headers: {
                    "Authorization": "token " + token,
                    "Accept": "application/vnd.github.v3+json"
                  }
                });
                if (commRes.ok) {
                  commentsJson = await commRes.json();
                }
              } catch (e) {
                console.error("Failed to fetch comments for issue", issue.number);
              }

              const filteredComments = (Array.isArray(commentsJson) ? commentsJson : [])
                .filter(c => c.user && c.user.login.toLowerCase() === allowedUser.toLowerCase())
                .map(c => ({
                  user: c.user.login,
                  created_at: new Date(c.created_at).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" }),
                  body: c.body
                }));

              return {
                title: issue.title,
                url: issue.html_url,
                created_at: new Date(issue.created_at).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" }),
                body: issue.body || "",
                comments: filteredComments
              };
            }

            async function splitByState(raw) {
              const open = [];
              const closed = [];
              if (!Array.isArray(raw)) {
                console.error("Error fetching issues:", raw);
                process.exit(1);
              }
              for (const issue of raw) {
                if (issue.pull_request) continue;
                const issueObj = await buildIssueObj(issue);
                if (issue.state === "open") {
                  open.push(issueObj);
                } else {
                  closed.push(issueObj);
                }
              }
              return { open, closed };
            }

            async function processData() {
              // NOTE: active/history keep ONLY global-alert for backwards
              // compatibility: external plugins and Discord automations must
              // keep reading these two keys so "info" never leaks to them.
              const global = await splitByState(rawGlobal);
              const info = await splitByState(rawInfo);

              const finalData = {
                updated_at: new Date().toLocaleTimeString("en-US", { timeStyle: "medium" }) + " (" + new Date().toLocaleDateString() + ")",
                active: global.open,
                history: global.closed,
                info_active: info.open,
                info_history: info.closed
              };

              fs.writeFileSync("issues.json", JSON.stringify(finalData, null, 2));
            }

            processData();
          '

      - name: Commit and push changes if issues.json updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add issues.json
          git diff --staged --quiet || (git commit -m "Auto-update status JSON from issues" && git push)
